<!doctype html><html><head><meta charset="utf-8"><title>C has+nth</title></head><body><button id='go'>build</button><ul id='list'></ul><div id='out'></div><script>document.getElementById('go').addEventListener('click',function(){var html='';var data=[['L1',0],['L2',1],['L3',1],['L4',0],['L5',1]];data.forEach(function(d){html+="<li class='item"+(d[1]?' promo':'')+"' data-id='"+d[0]+"'>"+(d[1]?"<em class='tag'>x</em>":'')+d[0]+'</li>';});document.getElementById('list').innerHTML=html;try{var els=document.querySelectorAll('li.item:has(.tag)');var second=document.querySelector('li.promo:nth-child(3 of .promo)');var ids=[].map.call(els,function(e){return e.dataset.id;});document.getElementById('out').textContent='PROMO='+ids.join(',')+'|THIRD='+(second?second.dataset.id:'none');}catch(e){document.getElementById('out').textContent='ERR:'+e.message;}});</script></body></html>
