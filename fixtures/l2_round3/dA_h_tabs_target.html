<!doctype html><html><head><meta charset="utf-8"><title>A tabs</title><style>.tab{display:none} .tab:target{display:block}</style></head><body><a id='l1' href='#t1'>1</a><a id='l2' href='#t2'>2</a><a id='l3' href='#t3'>3</a><div class='tab' id='t1'>SPEC_A</div><div class='tab' id='t2'>SPEC_B</div><div class='tab' id='t3'>SPEC_C</div><div id='log'></div><div id='out'></div><script>window.__seen=[];function r(){var t=['t1','t2','t3'];for(var i=0;i<3;i++){var p=document.getElementById(t[i]);if(getComputedStyle(p).display==='block'&&window.__seen.indexOf(p.textContent)<0)window.__seen.push(p.textContent);}document.getElementById('out').textContent='SPECS:'+window.__seen.join(',');}addEventListener('hashchange',r);r();</script></body></html>
