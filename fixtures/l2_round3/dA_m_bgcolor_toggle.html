<!doctype html><html><head><meta charset="utf-8"><title>A bg toggle</title><style>.hl{background-color:rgb(200,30,40)}</style></head><body><div id='cell'>row</div><button id='go'>flag</button><div id='out'></div><script>document.getElementById('go').addEventListener('click',function(){document.getElementById('cell').className='hl';});function read(){var b=getComputedStyle(document.getElementById('cell')).backgroundColor;document.getElementById('out').textContent=(b==='rgb(200, 30, 40)')?'FLAGGED_URGENT':('BG:'+b);}document.getElementById('cell').addEventListener('transitionend',read);new MutationObserver(read).observe(document.getElementById('cell'),{attributes:true});</script></body></html>
