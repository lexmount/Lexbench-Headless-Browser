<!doctype html><html><head><meta charset="utf-8"><title>A color table</title><style>.in{color:rgb(0,150,0)} .out{color:rgb(180,0,0)}</style></head><body><ul id='list'><li class='in' data-name='Alpha'>Alpha</li><li class='out' data-name='Beta'>Beta</li><li class='in' data-name='Gamma'>Gamma</li><li class='out' data-name='Delta'>Delta</li><li class='in' data-name='Epsilon'>Epsilon</li></ul><div id='out'></div><script>var items=document.querySelectorAll('#list li');var keep=[];for(var i=0;i<items.length;i++){if(getComputedStyle(items[i]).color==='rgb(0, 150, 0)')keep.push(items[i].dataset.name);}document.getElementById('out').textContent='INSTOCK:'+keep.join(',');</script></body></html>
