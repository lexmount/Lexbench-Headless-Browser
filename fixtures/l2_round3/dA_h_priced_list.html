<!doctype html><html><head><meta charset="utf-8"><title>A priced</title><style>.sale{color:rgb(220,0,0)} .lg{font-size:24px}</style></head><body><ul id='list'><li class='sale lg' data-id='P1'>P1</li><li class='lg' data-id='P2'>P2</li><li class='sale' data-id='P3'>P3</li><li class='sale lg' data-id='P4'>P4</li></ul><div id='out'></div><script>var li=document.querySelectorAll('#list li');var hot=[];for(var i=0;i<li.length;i++){var cs=getComputedStyle(li[i]);if(cs.color==='rgb(220, 0, 0)'&&cs.fontSize==='24px')hot.push(li[i].dataset.id);}document.getElementById('out').textContent='HOT:'+hot.join(',');</script></body></html>
