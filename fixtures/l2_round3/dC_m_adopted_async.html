<!doctype html><html><head><meta charset="utf-8"><title>C adopted async</title></head><body><div class='q' id='q'>x</div><div id='out'></div><script>setTimeout(function(){try{var s=new CSSStyleSheet();s.replaceSync('.q{font-size:29px}');document.adoptedStyleSheets=[s];var f=getComputedStyle(document.getElementById('q')).fontSize;document.getElementById('out').textContent=(f==='29px')?'ADOPTED_ASYNC_29':('F:'+f);}catch(e){document.getElementById('out').textContent='ERR:'+e.message;}},400);</script></body></html>
