<!doctype html><html><head><meta charset="utf-8"><title>fv cache</title></head><body><div id='out'>PENDING</div><script>function s(t){document.getElementById('out').textContent=t;}try{caches.open('fv').then(function(c){return c.put(new Request('/v'),new Response('CACHE_OK')).then(function(){return c.match('/v');});}).then(function(r){return r?r.text():'NOMATCH';}).then(s).catch(function(e){s('ERR:'+e.message);});}catch(e){s('ERR:'+e.message);}</script></body></html>
