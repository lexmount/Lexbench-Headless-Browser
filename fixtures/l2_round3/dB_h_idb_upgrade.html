<!doctype html><html><head><meta charset="utf-8"><title>B idb upgrade</title></head><body><div id='out'>PENDING</div><script>function set(t){document.getElementById('out').textContent=t;}try{function phase2(){var rq=indexedDB.open('r3_up',2);rq.onupgradeneeded=function(e){var db=e.target.result;var tx=e.target.transaction;var st=tx.objectStore('s');if(!st.indexNames.contains('byTag'))st.createIndex('byTag','tag',{unique:false});};rq.onsuccess=function(e){var db=e.target.result;var idx=db.transaction('s').objectStore('s').index('byTag');var g=idx.getAll('vip');g.onsuccess=function(){var r=g.result.map(function(x){return x.name;});set('VIP_AFTER_UPGRADE='+r.length+':'+r.join(','));};};}var rq1=indexedDB.open('r3_up',1);rq1.onupgradeneeded=function(e){e.target.result.createObjectStore('s',{keyPath:'id'});};rq1.onsuccess=function(e){var db=e.target.result;var tx=db.transaction('s','readwrite');var st=tx.objectStore('s');st.put({id:1,name:'ANN',tag:'vip'});st.put({id:2,name:'BOB',tag:'std'});st.put({id:3,name:'CAM',tag:'vip'});tx.oncomplete=function(){db.close();phase2();};};}catch(e){set('ERR:'+e.message);}</script></body></html>
