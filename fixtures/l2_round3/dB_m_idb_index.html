<!doctype html><html><head><meta charset="utf-8"><title>B idb index</title></head><body><div id='out'>PENDING</div><script>function set(t){document.getElementById('out').textContent=t;}try{var rq=indexedDB.open('r3_idx',1);rq.onupgradeneeded=function(e){var os=e.target.result.createObjectStore('s',{keyPath:'id'});os.createIndex('byCat','cat',{unique:false});};rq.onsuccess=function(e){var db=e.target.result;var tx=db.transaction('s','readwrite');var st=tx.objectStore('s');st.put({id:1,cat:'books',t:'T1'});st.put({id:2,cat:'toys',t:'T2'});st.put({id:3,cat:'books',t:'BOOKMATCH_T3'});tx.oncomplete=function(){var idx=db.transaction('s').objectStore('s').index('byCat');var rq2=idx.getAll('books');rq2.onsuccess=function(){var r=rq2.result.map(function(x){return x.t;});set('BOOKS='+r.length+':'+r.join(','));};};};}catch(e){set('ERR:'+e.message);}</script></body></html>
