<!doctype html><html><head><meta charset="utf-8"><title>A color gate</title><style>.tag{color:rgb(10,120,30)}</style></head><body><span class='tag' id='t'>x</span><div id='out'></div><script>var c=getComputedStyle(document.getElementById('t')).color;document.getElementById('out').textContent=(c==='rgb(10, 120, 30)')?'IN_STOCK_GREEN':('OTHER:'+c);</script></body></html>
