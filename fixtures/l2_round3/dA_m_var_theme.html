<!doctype html><html><head><meta charset="utf-8"><title>A var theme</title><style>:root{--accent:rgb(0,0,0)} .dark{--accent:rgb(90,200,255)} .price{color:var(--accent)}</style></head><body><div class='price' id='p'>$42</div><button id='go'>dark</button><div id='out'></div><script>document.getElementById('go').addEventListener('click',function(){document.documentElement.className='dark';});function read(){var c=getComputedStyle(document.getElementById('p')).color;document.getElementById('out').textContent=(c==='rgb(90, 200, 255)')?'THEME_DARK_ACCENT':('C:'+c);}new MutationObserver(read).observe(document.documentElement,{attributes:true});</script></body></html>
