<!doctype html><html><head><meta charset="utf-8"><title>B idb cursor</title></head><body><div id='out'>PENDING</div><script>function set(t){document.getElementById('out').textContent=t;}try{var rq=indexedDB.open('r3_cur',1);rq.onupgradeneeded=function(e){e.target.result.createObjectStore('s',{keyPath:'id'});};rq.onsuccess=function(e){var db=e.target.result;var tx=db.transaction('s','readwrite');var st=tx.objectStore('s');[{id:1,amt:10},{id:2,amt:25},{id:3,amt:5},{id:4,amt:60}].forEach(function(x){st.put(x);});tx.oncomplete=function(){var sum=0,n=0;var cur=db.transaction('s').objectStore('s').openCursor();cur.onsuccess=function(ev){var c=ev.target.result;if(c){if(c.value.amt>=10){sum+=c.value.amt;n++;}c.continue();}else{set('LARGE_ORDERS='+n+'_TOTAL='+sum);}};};};}catch(e){set('ERR:'+e.message);}</script></body></html>
