<!doctype html><html><head><meta charset="utf-8"><title>C has child inject</title></head><body><button id='go'>load</button><div id='wrap'></div><div id='out'></div><script>document.getElementById('go').addEventListener('click',function(){document.getElementById('wrap').innerHTML="<div class='item'><b>x</b></div><div class='item'><b class='sale'>HAS_SALE_ITEM</b></div>";});function r(){try{var el=document.querySelector('.item:has(> .sale)');if(el)document.getElementById('out').textContent=el.textContent.trim();}catch(e){document.getElementById('out').textContent='ERR:'+e.message;}}new MutationObserver(r).observe(document.getElementById('wrap'),{childList:true});</script></body></html>
