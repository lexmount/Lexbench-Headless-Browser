<!doctype html><html><head><meta charset="utf-8"><title>fv anim</title></head><body><div id='b'>x</div><div id='out'></div><script>try{document.getElementById('b').animate([{opacity:1},{opacity:0}],500);var n=document.getElementById('b').getAnimations().length;document.getElementById('out').textContent=(n>=1)?'ANIM_OK':('AN:'+n);}catch(e){document.getElementById('out').textContent='ERR:'+e.message;}</script></body></html>
