<!doctype html><html><head><meta charset="utf-8"><title>b3 cookie</title></head>
<body>
<div id="out"></div>
<script>
try {
  document.cookie = 'r3c=COOKIE_VAL_B3; path=/';
  var m = /r3c=([^;]+)/.exec(document.cookie||'');
  document.getElementById('out').textContent = m ? m[1] : 'NOCOOKIE';
} catch(e){ document.getElementById('out').textContent = 'ERR:'+e.message; }
</script>
</body></html>
