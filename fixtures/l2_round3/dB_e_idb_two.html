<!doctype html><html><head><meta charset="utf-8"><title>B idb two</title></head><body><div id='out'>PENDING</div><script>function set(t){document.getElementById('out').textContent=t;}try{var rq=indexedDB.open('r3_two',1);rq.onupgradeneeded=function(e){e.target.result.createObjectStore('s',{keyPath:'id'});};rq.onsuccess=function(e){var db=e.target.result;var tx=db.transaction('s','readwrite');tx.objectStore('s').put({id:1,v:'CART_ITEM_BOOK'});tx.objectStore('s').put({id:2,v:'CART_ITEM_PEN'});tx.oncomplete=function(){var st=db.transaction('s').objectStore('s');var out=[];var g1=st.get(1);g1.onsuccess=function(){out.push(g1.result.v);var g2=st.get(2);g2.onsuccess=function(){out.push(g2.result.v);set('CART:'+out.join(','));};};};};}catch(e){set('ERR:'+e.message);}</script></body></html>
