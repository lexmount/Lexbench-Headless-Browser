<!doctype html><html><head><meta charset="utf-8"><title>A var cascade</title><style>:root{--c:rgb(1,1,1)} .section{--c:rgb(20,40,60)} #leaf{color:var(--c)}</style></head><body><div class='section' id='s'><span id='leaf'>deep</span></div><div id='out'></div><script>setTimeout(function(){var c=getComputedStyle(document.getElementById('leaf')).color;document.getElementById('out').textContent=(c==='rgb(20, 40, 60)')?'SECTION_SCOPED_VAR':('C:'+c);},350);</script></body></html>
