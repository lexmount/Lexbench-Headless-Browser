<!doctype html><html><head><meta charset="utf-8"><title>C has compound</title></head><body><div id='list'><div class='row' data-id='R1'><span class='a'>a</span></div><div class='row' data-id='R2'><span class='a'>a</span><span class='b'>b</span></div><div class='row' data-id='R3'><span class='b'>b</span></div><div class='row' data-id='R4'><span class='a'>a</span><span class='b'>b</span></div></div><div id='out'></div><script>try{var els=document.querySelectorAll('.row:has(> .a):has(> .b)');var ids=[].map.call(els,function(e){return e.dataset.id;});document.getElementById('out').textContent='BOTH:'+ids.join(',');}catch(e){document.getElementById('out').textContent='ERR:'+e.message;}</script></body></html>
