<!doctype html><html><head><meta charset="utf-8"><title>diag geometry</title>
<style>
  *{margin:0;padding:0;box-sizing:content-box;}
  html,body{margin:0;padding:0;}
  /* Plain box: no border/padding so content box == border box == 240x120. */
  #box{position:absolute;left:50px;top:60px;width:240px;height:120px;background:#4488cc;}
  /* Padded/bordered box: content 200x100, padding 10, border 5 solid. */
  #padbox{position:absolute;left:400px;top:60px;width:200px;height:100px;padding:10px;border:5px solid #cc4444;background:#eec;}
</style></head><body>
<div id="box"></div>
<div id="padbox"></div>
</body></html>
