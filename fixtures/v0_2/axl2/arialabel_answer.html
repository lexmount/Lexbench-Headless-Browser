<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AXL2 Fixture: aria-label carries the answer</title>
<style>
  /* Visually hide via clip; text stays in DOM but AX name is the aria-label. */
  .masked { position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<h1>Order Confirmation</h1>
<!-- Visible text is a decoy; the accessible name (aria-label) holds the real code. -->
<span id="code" aria-label="CONFIRM-4821">REDACTED</span>
<p class="masked">internal-token-should-not-be-the-answer</p>
</body>
</html>
