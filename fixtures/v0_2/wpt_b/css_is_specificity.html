<!doctype html><html><head><meta charset="utf-8"><title>wpt-b :is() specificity</title>
<style>
.c { color: rgb(1, 1, 1); }
:is(#nope, .c) { color: rgb(2, 2, 2); }
</style></head>
<body>
<p id="t" class="c">x</p>
<div id="out"></div>
<script>
try{
  var color=getComputedStyle(document.getElementById('t')).color;
  document.getElementById('out').textContent='IS_SPEC:'+(color==='rgb(2, 2, 2)'?'IS_WINS':'LOST')+':'+color;
}catch(e){document.getElementById('out').textContent='ERR:'+e.message;}
</script></body></html>
