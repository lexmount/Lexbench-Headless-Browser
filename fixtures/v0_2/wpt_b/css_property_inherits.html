<!doctype html><html><head><meta charset="utf-8"><title>wpt-b registered property inherits flag</title></head>
<body>
<div id="p" style="--pi: 5px; --pn: 5px"><div id="c"></div></div>
<div id="out"></div>
<script>
try{
  CSS.registerProperty({name:'--pi',syntax:'<length>',inherits:true,initialValue:'1px'});
  CSS.registerProperty({name:'--pn',syntax:'<length>',inherits:false,initialValue:'1px'});
  var cs=getComputedStyle(document.getElementById('c'));
  var pi=cs.getPropertyValue('--pi').trim();
  var pn=cs.getPropertyValue('--pn').trim();
  document.getElementById('out').textContent='INHERITS:pi='+pi+';pn='+pn;
}catch(e){document.getElementById('out').textContent='ERR:'+e.message;}
</script></body></html>
