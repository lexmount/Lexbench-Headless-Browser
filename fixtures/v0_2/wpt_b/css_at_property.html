<!doctype html><html><head><meta charset="utf-8"><title>wpt-b @property at-rule</title>
<style>
@property --theme {
  syntax: '<color>';
  inherits: false;
  initial-value: rgb(5, 5, 5);
}
#t { color: var(--theme); }
</style></head>
<body>
<div id="t">x</div>
<div id="out"></div>
<script>
try{
  var color=getComputedStyle(document.getElementById('t')).color;
  document.getElementById('out').textContent='ATPROP:'+(color==='rgb(5, 5, 5)'?'INITIAL_USED':'FALLBACK')+':'+color;
}catch(e){document.getElementById('out').textContent='ERR:'+e.message;}
</script></body></html>
