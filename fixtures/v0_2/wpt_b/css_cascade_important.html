<!doctype html><html><head><meta charset="utf-8"><title>wpt-b cascade !important vs specificity</title>
<style>
#t { color: rgb(1, 2, 3); }
.c { color: rgb(7, 8, 9) !important; }
</style></head>
<body>
<p id="t" class="c">x</p>
<div id="out"></div>
<script>
try{
  var color=getComputedStyle(document.getElementById('t')).color;
  document.getElementById('out').textContent='CASCADE:'+(color==='rgb(7, 8, 9)'?'IMPORTANT_WINS':'SPEC_WINS')+':'+color;
}catch(e){document.getElementById('out').textContent='ERR:'+e.message;}
</script></body></html>
