<!doctype html><html><head><meta charset="utf-8"><title>wpt-b MutationObserver attributes</title></head>
<body>
<div id="el" data-x="one" class="c">x</div>
<div id="out"></div>
<script>
try{
  var el=document.getElementById('el');
  var mo=new MutationObserver(function(records){
    var parts=[];
    for(var i=0;i<records.length;i++){ parts.push(records[i].attributeName+'='+records[i].oldValue); }
    document.getElementById('out').textContent='MO_ATTR:'+parts.join(',');
  });
  mo.observe(el,{attributes:true,attributeOldValue:true,attributeFilter:['data-x']});
  el.setAttribute('data-x','two');
  el.className='changed';
  el.setAttribute('data-x','three');
}catch(e){document.getElementById('out').textContent='ERR:'+e.message;}
</script></body></html>
