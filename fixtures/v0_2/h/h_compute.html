<!doctype html>
<html>
<head><meta charset="utf-8"><title>h compute</title></head>
<body data-a="6" data-b="7">
<h1>data-attribute product</h1>
<button id="go">compute</button>
<output id="result"></output>
<script>
document.getElementById('go').addEventListener('click', function(){
  var a = Number(document.body.getAttribute('data-a'));
  var b = Number(document.body.getAttribute('data-b'));
  document.getElementById('result').textContent = String(a * b + 7);
});
</script>
</body>
</html>
