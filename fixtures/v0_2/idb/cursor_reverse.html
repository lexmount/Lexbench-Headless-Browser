<!doctype html><html><head><meta charset="utf-8"><title>idb cursor reverse</title></head><body><div id="out">PENDING</div><script>
// openCursor(null,'prev'): descending key traversal. A non-conforming engine
// that ignores direction would emit ascending order and fail.
var DB='v2idb_currev_'+((new URLSearchParams(location.search)).get('db')||'default');
function set(t){document.getElementById('out').textContent=t;}
function fail(e){set('ERR:'+((e&&e.message)||e));}
try{
  var rq=indexedDB.open(DB,1);
  rq.onupgradeneeded=function(e){e.target.result.createObjectStore('s',{keyPath:'id'});};
  rq.onerror=function(){fail(rq.error);};
  rq.onsuccess=function(e){
    var db=e.target.result;var tx=db.transaction('s','readwrite');var st=tx.objectStore('s');
    [{id:2,c:'B'},{id:4,c:'D'},{id:1,c:'A'},{id:5,c:'E'},{id:3,c:'C'}].forEach(function(x){st.put(x);});
    tx.oncomplete=function(){
      var acc=[];var cur=db.transaction('s').objectStore('s').openCursor(null,'prev');
      cur.onsuccess=function(ev){var c=ev.target.result;if(c){acc.push(c.value.c);c.continue();}else{set('REV='+acc.join(','));}};
      cur.onerror=function(){fail(cur.error);};
    };
    tx.onerror=function(){fail(tx.error);};
  };
}catch(e){fail(e);}
</script></body></html>
