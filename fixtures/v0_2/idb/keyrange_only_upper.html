<!doctype html><html><head><meta charset="utf-8"><title>idb IDBKeyRange only/upperBound</title></head><body><div id="out">PENDING</div><script>
// IDBKeyRange.only(x) selects a single key; upperBound(x) is inclusive while
// upperBound(x,true) is exclusive. The three ranges distinguish boundary
// handling on the upper end.
var DB='v2idb_krou_'+((new URLSearchParams(location.search)).get('db')||'default');
function set(t){document.getElementById('out').textContent=t;}
function fail(e){set('ERR:'+((e&&e.message)||e));}
try{
  var rq=indexedDB.open(DB,1);
  rq.onupgradeneeded=function(e){e.target.result.createObjectStore('s',{keyPath:'id'});};
  rq.onerror=function(){fail(rq.error);};
  rq.onsuccess=function(e){
    var db=e.target.result;var tx=db.transaction('s','readwrite');var st=tx.objectStore('s');
    for(var i=1;i<=10;i++)st.put({id:i});
    tx.oncomplete=function(){
      var rt=db.transaction('s').objectStore('s');
      var only=rt.getAllKeys(IDBKeyRange.only(5));
      var ubIncl=rt.getAllKeys(IDBKeyRange.upperBound(5));
      var ubExcl=rt.getAllKeys(IDBKeyRange.upperBound(5,true));
      var rtx=rt.transaction;
      rtx.oncomplete=function(){set('ONLY='+only.result.join(',')+'_UB_INCL='+ubIncl.result.join(',')+'_UB_EXCL='+ubExcl.result.join(','));};
      rtx.onerror=function(){fail(rtx.error);};
    };
    tx.onerror=function(){fail(tx.error);};
  };
}catch(e){fail(e);}
</script></body></html>
