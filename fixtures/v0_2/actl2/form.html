<!doctype html>
<html>
<head><meta charset="utf-8"><title>actl2 form</title></head>
<body>
<h1>form</h1>
<input id="field" type="text" value="">
<button id="submit">submit</button>
<div id="status">idle</div>
<script>
// Submit reads the typed value and combines it with a server token fetched by
// XHR, so the answer proves both insertText (the value) and the click-driven
// request (the token) happened.
document.getElementById("submit").addEventListener("click", function () {
  var v = document.getElementById("field").value;
  fetch("/v2/actl2/token.txt")
    .then(function (r) { return r.text(); })
    .then(function (t) { document.getElementById("status").textContent = v + "|" + t.trim(); })
    .catch(function (e) { document.getElementById("status").textContent = "ERR:" + String(e); });
});
</script>
</body>
</html>
