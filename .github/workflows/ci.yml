name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Kitesurf lane asserts that this branch descends from the main
          # commit recorded in config/kitesurf_experiments.json. A shallow
          # clone does not contain that commit, so the check errors out.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install driver dependencies
        run: |
          npm ci
          python3 -m pip install -e '.[drivers,dev]'
      - name: Dataset integrity
        run: python3 -m runner.run validate
      - name: Scenario spec check
        run: python3 -m runner.run scenarios --check
      - name: Unit tests
        run: python3 -m pytest test -q
